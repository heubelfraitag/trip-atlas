name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Replace any missing or straight-line legs with real walking/road routes
      # before building. Legs that already have a route are left alone. If the
      # routing server is unreachable the build still goes ahead.
      - name: Fill in real route geometry
        continue-on-error: true
        run: |
          for f in trips/*.json; do
            node scripts/precompute-routes.mjs "$f"
          done

      - name: Build
        env:
          # Repo name path so assets resolve under https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Copy index.html to 404.html for SPA deep-link routing
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
